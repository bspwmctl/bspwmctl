# nfpm config: builds the .deb, .rpm and Arch package from the same files.
# VERSION comes from the environment (packaging/build.sh reads it from ./bspwmctl).

name: bspwmctl
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
release: 1
section: x11
priority: optional
maintainer: "Luka Ramon Tinarelli <lukatinarelli@protonmail.com>"
vendor: bspwmctl
homepage: https://github.com/bspwmctl/bspwmctl
license: MIT
description: |-
  Opinionated bspwm desktop installer and manager.
  Installs bspwm, sxhkd, polybar, picom and the rest of the desktop from
  your distribution's packages and applies a ready-to-use configuration.
  Run `bspwmctl install` after installing this package.

# Only what bspwmctl itself needs; the desktop is installed by `bspwmctl install`
depends:
  - bash
  - sudo
  - diffutils
  - fontconfig
  - curl

contents:
  - src: ./bspwmctl
    dst: /usr/bin/bspwmctl
    file_info:
      mode: 0755

  - src: ./config
    dst: /usr/share/bspwmctl/config
    type: tree

  - src: ./bspwmctl.1.gz
    dst: /usr/share/man/man1/bspwmctl.1.gz

  - src: ./completions/bspwmctl.bash
    dst: /usr/share/bash-completion/completions/bspwmctl

  - src: ./completions/bspwmctl.fish
    dst: /usr/share/fish/vendor_completions.d/bspwmctl.fish

  # Debian's zsh doesn't read site-functions, Arch's and Fedora's don't read vendor-completions
  - src: ./completions/_bspwmctl
    dst: /usr/share/zsh/vendor-completions/_bspwmctl
    packager: deb

  - src: ./completions/_bspwmctl
    dst: /usr/share/zsh/site-functions/_bspwmctl
    packager: rpm

  - src: ./completions/_bspwmctl
    dst: /usr/share/zsh/site-functions/_bspwmctl
    packager: archlinux

  - src: ./CHANGELOG.md
    dst: /usr/share/doc/bspwmctl/CHANGELOG.md

  - src: ./LICENSE
    dst: /usr/share/doc/bspwmctl/copyright
    packager: deb

  - src: ./LICENSE
    dst: /usr/share/licenses/bspwmctl/LICENSE
    packager: rpm

  - src: ./LICENSE
    dst: /usr/share/licenses/bspwmctl/LICENSE
    packager: archlinux

rpm:
  group: User Interface/Desktops

archlinux:
  packager: "Luka Ramon Tinarelli <lukatinarelli@protonmail.com>"
