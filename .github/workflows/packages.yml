name: Packages

# Builds the .deb, .rpm and Arch packages, tests them on each distro and,
# when a GitHub release is published, attaches them to it.

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          shellcheck --severity=warning \
            bspwmctl packaging/build.sh \
            config/bspwm/bspwmrc config/bspwm/scripts/bspwm_resize \
            config/polybar/launch.sh config/polybar/scripts/ethernet_status config/polybar/scripts/vpn_status

  build:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag matches VERSION
        if: github.event_name == 'release'
        run: |
          version="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' bspwmctl)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match VERSION=\"$version\" in bspwmctl"
            exit 1
          fi

      - name: Build packages
        run: ./packaging/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:13", "fedora:latest", "archlinux:latest"]
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Install package
        run: |
          . /etc/os-release
          case "$ID" in
            ubuntu|debian) apt-get update && apt-get install -y ./dist/*.deb ;;
            fedora)        dnf install -y ./dist/*.rpm util-linux ;;  # util-linux: su, for the test
            arch)          pacman -Syu --noconfirm && pacman -U --noconfirm ./dist/*.pkg.tar.zst ;;
          esac

      - name: Smoke test
        run: |
          bspwmctl --version
          test -x /usr/share/bspwmctl/config/bspwm/bspwmrc
          useradd -m tester
          su tester -c 'bspwmctl theme default'
          test -x /home/tester/.config/bspwm/bspwmrc
          test -f /home/tester/.config/sxhkd/sxhkdrc
          su tester -c 'bspwmctl uninstall --yes'
          test ! -e /home/tester/.config/bspwm

  release:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
